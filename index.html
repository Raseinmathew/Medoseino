<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Medoseino</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      width: 100%;
      font-family: sans-serif;
      scroll-behavior: smooth;
    }

    .landing {
      height: 100vh;
      background: url('background.png') no-repeat center center;
      background-size: cover;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .landing img {
      width: 180px;
    }

    .shop-button {
      margin-top: 20px;
      padding: 10px 20px;
      background: black;
      color: white;
      border: none;
      text-decoration: none;
      font-size: 16px;
      border-radius: 6px;
    }

    #merch {
      padding: 100px 20px;
      background: #fff;
      text-align: center;
      min-height: 100vh;
    }

    #merch h2 {
      font-size: 2rem;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <div class="landing">
    <img src="logo.png" alt="Medoseino Logo" />
    <a href="#merch" class="shop-button">Shop Now</a>
  </div>

  <section id="merch">
    <h2>Our Merchandise</h2>
    <!-- Add your products or embeds here -->
  </section>

</body>
</html>
