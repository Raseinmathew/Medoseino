<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Medoseino | Books & Merch from Another Realm</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      background-color: #111;
      color: #fff;
    }

    header {
      background: #1e1e1e;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 1.8rem;
      color: #39f;
    }

    nav a {
      color: #ccc;
      margin-left: 1.5rem;
      text-decoration: none;
    }

    nav a:hover {
      color: #fff;
    }

    .hero {
      padding: 4rem 2rem;
      text-align: center;
      background: url('background.png') no-repeat center center;
      background-size: cover;
      position: relative;
    }

    .hero::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.6); /* optional dark overlay for readability */
      z-index: 0;
    }

    .hero-content {
      position: relative;
      z-index: 1;
    }

    .hero img {
      width: 150px;
      margin-bottom: 1rem;
    }

    .hero h2 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    .hero p {
      font-size: 1.1rem;
      max-width: 600px;
      margin: 0 auto;
    }

    .buttons {
      margin-top: 2rem;
    }

    .buttons a {
      display: inline-block;
      padding: 0.8rem 1.5rem;
      margin: 0.5rem;
      background: #39f;
      color: #000;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .buttons a:hover {
      background: #5af;
    }

    footer {
      text-align: center;
      padding: 2rem;
      font-size: 0.9rem;
      color: #666;
    }
  </style>
</head>
<body>
  <header>
    <h1>Medoseino</h1>
    <nav>
      <a href="#books">Books</a>
      <a href="#merch">Merch</a>
      <a href="#ai">AI Assistant</a>
    </nav>
  </header>
