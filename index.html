<!-- AI Chatbox -->
<div id="chatWidget" class="chatbox" style="display: none;">
  <div id="chatMessages" class="chat-messages"></div>
  <input id="userInput" type="text" placeholder="Ask about our dresses..." />
  <button id="sendMessage">Send</button>
</div>

<style>
  .chatbox {
    position: fixed;
    bottom: 90px;
    right: 20px;
    width: 320px;
    max-height: 400px;
    background: #111;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 10px;
    box-shadow: 0 0 15px rgba(0,0,0,0.6);
    z-index: 10000;
    display: flex;
    flex-direction: column;
  }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    margin-bottom: 10px;
    color: #f0f0f0;
    font-size: 14px;
  }

  .chat-messages div {
    margin: 5px 0;
  }

  #userInput {
    flex: 1;
    padding: 6px;
    background: #222;
    color: #fff;
    border: 1px solid #444;
    border-radius: 6px;
  }

  #sendMessage {
    margin-left: 5px;
    padding: 6px 12px;
    background: #39f;
    color: #000;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
</style>

<script>
  const talkToAI = document.querySelectorAll('a[href="#ai"]');
  const chatWidget = document.getElementById("chatWidget");
  const userInput = document.getElementById("userInput");
  const sendMessageBtn = document.getElementById("sendMessage");
  const chatMessages = document.getElementById("chatMessages");

  talkToAI.forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.preventDefault();
      chatWidget.style.display = chatWidget.style.display === "none" ? "flex" : "none";
    });
  });

  sendMessageBtn.addEventListener("click", async () => {
    const userMsg = userInput.value.trim();
    if (!userMsg) return;

    chatMessages.innerHTML += `<div><strong>You:</strong> ${userMsg}</div>`;
    userInput.value = "";

    const reply = await getAIReply(userMsg);
    chatMessages.innerHTML += `<div><strong>AI:</strong> ${reply}</div>`;
    chatMessages.scrollTop = chatMessages.scrollHeight;
  });

  async function getAIReply(message) {
    try {
      const response = await fetch("https://api.openai.com/v1/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer YOUR_OPENAI_API_KEY"  // ← Replace this
        },
        body: JSON.stringify({
          model: "gpt-3.5-turbo",
          messages: [
            {
              role: "system",
              content: "You are Medoseino’s merch assistant. Only reply with dress and store information. Do not answer unrelated questions. If unsure, say: ‘I’m here to help with Medoseino merch and dress details! For other questions, please explore our site.’"
            },
            {
              role: "user",
              content: message
            }
          ]
        })
      });

      const data = await response.json();
      return data.choices[0].message.content;
    } catch (err) {
      console.error(err);
      return "Sorry, something went wrong while connecting to the AI.";
    }
  }
</script>
