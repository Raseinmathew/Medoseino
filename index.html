<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medoseino</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-black text-white">

  <!-- Navbar -->
  <header class="flex justify-between items-center p-6 bg-black">
    <h1 class="text-2xl font-bold text-blue-500">Medoseino</h1>
    <nav class="space-x-6 text-white">
      <a href="#books" class="hover:text-blue-400">Books</a>
      <a href="#merch" class="hover:text-blue-400">Merch</a>
    </nav>
  </header>

  <!-- Hero Section -->
  <section
    class="relative h-screen bg-center bg-no-repeat bg-contain flex flex-col items-center justify-center"
    style="background-image: url('/path/to/background.png.png');"
  >
    <div class="mt-32 text-center"> <!-- pushes content lower -->
      <h2 class="text-5xl font-extrabold mb-10">Books & Merch from Another Realm</h2>
      
      <!-- Buttons -->
      <div class="flex justify-center space-x-6 mt-20">
        <a href="#books" class="px-6 py-3 bg-blue-900 text-white font-semibold rounded-xl hover:bg-blue-800 transition">
          Explore Books
        </a>
        <a href="#merch" class="px-6 py-3 bg-blue-900 text-white font-semibold rounded-xl hover:bg-blue-800 transition">
          Shop Merch
        </a>
      </div>
    </div>
  </section>

  <!-- Books Section -->
  <section id="books" class="py-20 bg-black text-center">
    <h3 class="text-3xl font-bold mb-4">Books</h3>
    <p class="text-gray-300">Dive into original tales and epic adventures from otherworldly realms.</p>
  </section>

  <!-- Merch Section -->
  <section id="merch" class="py-20 bg-black text-center">
    <h3 class="text-3xl font-bold mb-4">Merch</h3>
    <p class="text-gray-300">Explore merchandise inspired by fantastical stories and symbols.</p>
  </section>

</body>
</html>
