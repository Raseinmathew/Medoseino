<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Medoseino</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      width: 100%;
      font-family: Arial, sans-serif;
    }

    .landing {
      height: 100vh;
      background: url('background.png') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .landing img {
      width: 200px;
      height: auto;
    }

    .shop-button {
      margin-top: 20px;
      padding: 12px 24px;
      font-size: 16px;
      background-color: black;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      transition: background 0.3s ease;
    }

    .shop-button:hover {
      background-color: #333;
    }

    #merch {
      padding: 100px 20px;
      background: #f5f5f5;
      min-height: 100vh;
      text-align: center;
    }

    #merch h2 {
      font-size: 32px;
      margin-bottom: 30px;
    }

    /* Add your merch items styling here */
  </style>
</head>
<body>

  <!-- Landing Section -->
  <div class="landing">
    <img src="logo.png" alt="Medoseino Logo" />
    <a href="#merch" class="shop-button">Shop Now</a>
  </div>

  <!-- Merch Section -->
  <section id="merch">
    <h2>Our Merchandise</h2>
    <!-- Add your T-shirts or book embeds here -->
  </section>

</body>
</html>
